<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>الحجز - NAJLA STAR</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>NAJLA STAR للسفر والسياحة</h1>
    <nav>
      <a href="offers.html">العروض</a>
      <a href="services.html">خدماتنا</a>
      <a href="booking.html">الحجز</a>
      <a href="contact.html">اتصل بنا</a>
      <button class="btn-logout" onclick="logout()">تسجيل خروج</button>
    </nav>
  </header>

  <main class="container">
    <h2>نموذج الحجز</h2>
    <form id="bookingForm">
      
      <label>الاسم الكامل:</label>
      <input type="text" id="name" required>

      <label>رقم الهاتف:</label>
      <input type="tel" id="phone" required>

      <label>الوجهة:</label>
      <select id="destinationSelect" required>
        <option value="">-- اختر الوجهة --</option>
        <option value="القاهرة">القاهرة</option>
        <option value="دبي">دبي</option>
        <option value="اسطنبول">اسطنبول</option>
        <option value="جدة">جدة</option>
        <option value="الرياض">الرياض</option>
      </select>

      <label>تاريخ السفر:</label>
      <input type="date" id="date" required>

      <label>عدد الاشخاص:</label>
      <input type="number" id="people" min="1" value="1" required>

      <label>ملاحظات:</label>
      <textarea id="notes" rows="3"></textarea>

      <button type="submit" class="btn">تأكيد الحجز عبر واتساب</button>
    </form>
  </main>

  <script src="script.js"></script>
  <script>
    // كود ارسال الواتساب
    document.getElementById('bookingForm').addEventListener('submit', function(e){
      e.preventDefault();
      
      let name = document.getElementById('name').value;
      let phone = document.getElementById('phone').value;
      let destination = document.getElementById('destinationSelect').value;
      let date = document.getElementById('date').value;
      let people = document.getElementById('people').value;
      let notes = document.getElementById('notes').value;
      
      let message = `🔔 *حجز جديد من موقع NAJLA STAR* 🔔%0A%0A
*الاسم:* ${name}%0A
*الرقم:* ${phone}%0A
*الوجهة:* ${destination}%0A
*التاريخ:* ${date}%0A
*عدد الاشخاص:* ${people}%0A
*الملاحظات:* ${notes}`;
      
      // 👇 غيري الرقم دا لرقمك حق الواتساب. لازم يبدأ بـ 249
      let myWhatsApp = "+249 96 128 8504"; 
      
      window.open(`https://wa.me/${myWhatsApp}?text=${message}`, '_blank');
    });

    // عشان يختار الوجهة الجات من زر "احجز الان"
    window.onload = function() {
      let dest = localStorage.getItem('selectedDestination');
      if(dest && document.getElementById('destinationSelect')){
        document.getElementById('destinationSelect').value = dest;
        localStorage.removeItem('selectedDestination');
      }
    }
  </script>
</body>
</html>
