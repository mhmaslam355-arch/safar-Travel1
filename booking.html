<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NAJLA STAR - الحجز</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&family=Montserrat:wght@700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="navbar"><div class="logo">NAJLA STAR</div><nav><a href="offers.html">العروض</a><a href="services.html">خدماتنا</a><a href="contact.html">اتصل بنا</a><button class="btn-logout" onclick="logout()">تسجيل خروج</button></nav></header>
<div class="container">
  <h2 class="section-title">احجز رحلتك الان ✈️</h2>
  <form class="booking-form" onsubmit="alert('تم استلام طلب الحجز بنجاح. سوف نتواصل معك خلال 24 ساعة'); return false;">
    <div class="form-row">
      <div class="form-group">
        <label>الاسم الكامل</label>
        <input type="text" placeholder="ادخل اسمك" required>
      </div>
      <div class="form-group">
        <label>رقم الهاتف</label>
        <input type="tel" placeholder="0912xxxxxx" required>
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>الوجهة</label>
        <select id="destinationSelect" required>
          <option>اختر الوجهة</option>
          <option>القاهرة - مصر</option>
          <option>دبي - الامارات</option>
          <option>اسطنبول - تركيا</option>
        </select>
      </div>
      <div class="form-group">
        <label>عدد الاشخاص</label>
        <input type="number" placeholder="1" min="1" required>
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>تاريخ المغادرة</label>
        <input type="date" required>
      </div>
      <div class="form-group">
        <label>تاريخ العودة</label>
        <input type="date" required>
      </div>
    </div>
    <div class="form-group">
      <label>ملاحظات اضافية</label>
      <textarea rows="3" placeholder="طلبات خاصة..."></textarea>
    </div>
    <button type="submit" class="btn-book">تاكيد الحجز</button>
  </form>
  <div class="logout-section">
    <button class="btn-logout-big" onclick="logout()">🚪 تسجيل الخروج</button>
  </div>
</div>
<script src="script.js"></script>
</body>
</html>
