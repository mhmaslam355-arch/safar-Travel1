<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NAJLA STAR - تسجيل الدخول</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&family=Montserrat:wght@700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<section id="loginPage">
  <div class="icon icon1">✈️</div> <div class="icon icon2">🧳</div> 
  <div class="icon icon3">🛂</div> <div class="icon icon4">🌍</div>

  <h1 class="company-name">NAJLA STAR<br>Travel & Tourism</h1>
  <p class="tagline">"Dream. Travel. Discover." <br> مع نجلاء استار رحلتك تبدأ من هنا</p>

  <div class="main-buttons" id="mainBtns">
    <button class="main-btn-pink" onclick="showBox('loginBox')">تسجيل الدخول</button>
    <button class="main-btn-blue" onclick="showBox('registerBox')">تسجيل حساب جديد</button>
  </div>

  <div class="box" id="loginBox">
    <h2>تسجيل الدخول</h2>
    <form onsubmit="login(event)">
      <input type="email" placeholder="الايميل Email" required>
      <input type="password" placeholder="كلمة السر Password" required>
      <button type="submit" class="btn btn-main">دخول Login</button>
    </form>
    <p><a class="back-link" onclick="hideBoxes()">⬅️ الرجوع</a></p>
  </div>

  <div class="box" id="registerBox">
    <h2>انشاء حساب جديد</h2>
    <form onsubmit="register(event)">
      <input type="text" placeholder="الاسم الكامل Full Name" required>
      <input type="email" placeholder="الايميل Email" required>
      <input type="password" placeholder="كلمة المرور Password" required>
      <button type="submit" class="btn btn-blue">تسجيل Register</button>
    </form>
    <div class="divider">او سجل باستخدام</div>
    <button class="btn btn-google" onclick="window.location.href='offers.html'">🔴 التسجيل باستخدام جوجل</button>
    <button class="btn btn-facebook" onclick="window.location.href='offers.html'">🔵 التسجيل باستخدام فيسبوك</button>
    <p style="margin-top:15px"><a class="back-link" onclick="hideBoxes()">⬅️ الرجوع</a></p>
  </div>
</section>
<script src="script.js"></script>
</body>
</html>
